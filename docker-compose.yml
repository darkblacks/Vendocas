# Local development / single-VPS production baseline.
#   docker compose up -d postgres redis                # infra only (run API/web from source)
#   docker compose --profile app up -d --build         # full stack behind Caddy
#   docker compose --profile app --profile monitoring up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vendocas
      POSTGRES_USER: ${DB_USER:-vendocas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vendocas}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vendocas}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:6379:6379"]

  api:
    profiles: [app]
    image: ghcr.io/${GHCR_REPO:-darkblacks/vendocas}/api:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vendocas
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  web:
    profiles: [app]
    image: ghcr.io/${GHCR_REPO:-darkblacks/vendocas}/web:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on: [api]
    restart: unless-stopped

  caddy:
    profiles: [app]
    image: caddy:2.10-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-api.localhost}
    volumes:
      - ./infrastructure/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3001:3000"]
    volumes: [./infrastructure/monitoring/grafana:/etc/grafana/provisioning/dashboards:ro]

volumes:
  pgdata:
  caddy_data:
