# Netlify project: "Vendocas Control Center" — base directory apps/control (monorepo).
# NOT deployed yet. See docs/netlify-control-setup.md. All secrets are Netlify environment variables (never in Git).
[build]
  base = "apps/control"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @vendocas/control build"
  publish = ".next"
  # Skip builds when nothing relevant to this app changed (exit 0 = skip).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../../packages/design-system ../../pnpm-lock.yaml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

# The 6-hour session reaper runs on Netlify's scheduler (independent of the Codespace and of site visits).
[functions."codespace-scheduler"]
  schedule = "*/5 * * * *"

# The Next.js runtime (@netlify/plugin-nextjs v5) is applied automatically by Netlify for Next.js sites;
# it is intentionally not pinned here so no extra package is required in this repository.
