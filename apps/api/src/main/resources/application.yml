spring:
  application:
    name: vendocas-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vendocas}
    username: ${DB_USER:vendocas}
    password: ${DB_PASSWORD:vendocas}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: false   # Redis is auxiliary (cache/rate-limit); its outage must not fail readiness
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    com.platform: INFO

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  api-public-url: ${API_PUBLIC_URL:http://localhost:8080}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt-secret: ${JWT_SECRET:}
    credentials-encryption-key: ${CREDENTIALS_ENCRYPTION_KEY:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    cookie-domain: ${COOKIE_DOMAIN:}
    secure-cookies: ${SECURE_COOKIES:true}
  mail:
    mode: ${MAIL_MODE:ses}
    from-address: ${MAIL_FROM_ADDRESS:no-reply@vendocas.com}
    from-name: ${MAIL_FROM_NAME:Vendocas}
    platform-domain: ${PLATFORM_EMAIL_DOMAIN:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    automatic-tax: ${STRIPE_AUTOMATIC_TAX:true}
    invoice-days-until-due: ${INVOICE_DAYS_UNTIL_DUE:10}
  seller:
    legal-name: ${SELLER_LEGAL_NAME:}
    country-code: ${SELLER_COUNTRY:}
    tax-id: ${SELLER_TAX_ID:}
    municipal-registration: ${SELLER_MUNICIPAL_REGISTRATION:}
    service-code: ${SELLER_NFSE_SERVICE_CODE:}
    municipality-code: ${SELLER_MUNICIPALITY_CODE:}
  aws:
    region: ${AWS_REGION:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    ses-configuration-set: ${SES_CONFIGURATION_SET:}
    sns-topic-arn: ${SES_SNS_TOPIC_ARN:}
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    embedded-signup-config-id: ${META_EMBEDDED_SIGNUP_CONFIG_ID:}
    webhook-verify-token: ${META_WEBHOOK_VERIFY_TOKEN:}
    graph-version: ${META_GRAPH_VERSION:v23.0}
    graph-base-url: ${META_GRAPH_BASE_URL:https://graph.facebook.com}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
  focus-nfe:
    token: ${FOCUS_NFE_TOKEN:}
    environment: ${FOCUS_NFE_ENVIRONMENT:homologacao}
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
  workers:
    enabled: ${WORKERS_ENABLED:true}
    batch-size: 50
    lease-duration: 2m
