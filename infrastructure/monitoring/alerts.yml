groups:
  - name: vendocas
    rules:
      - alert: ApiDown
        expr: up{job="vendocas-api"} == 0
        for: 2m
        labels: { severity: critical }
      - alert: DeadJobs
        expr: increase(jobs_dead_total[15m]) > 0
        labels: { severity: warning }
        annotations: { summary: "Durable jobs moved to DEAD — check Admin → Dead letters" }
      - alert: AutomationDeadLetters
        expr: increase(automation_instances_dead_total[15m]) > 0
        labels: { severity: warning }
      - alert: MessageFailureRateHigh
        expr: sum(rate(messages_failed_total[15m])) / clamp_min(sum(rate(messages_submitted_total[15m])), 1) > 0.2
        for: 15m
        labels: { severity: warning }
      - alert: ProviderLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, provider) (rate(messages_provider_latency_seconds_bucket[10m]))) > 5
        for: 10m
        labels: { severity: warning }
      - alert: HighHttp5xx
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 1
        for: 5m
        labels: { severity: critical }
