name: CI

# Entry point for every push/PR. Detects what changed and calls only the pipelines that are needed:
#   apps/web → web.yml · apps/control → control.yml · apps/api → api.yml · shared packages → their dependents
#   legacy/ → nothing (only the integrity check below) · docs → nothing
# Publishing (Netlify / homologation) lives inside the called workflows and is DISABLED unless the repository
# variables ENABLE_NETLIFY_WEB_DEPLOY / ENABLE_NETLIFY_CONTROL_DEPLOY / ENABLE_API_HOMOLOG_DEPLOY are "true".
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      control: ${{ steps.detect.outputs.control }}
      api: ${{ steps.detect.outputs.api }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests of the change detector and workflow guards
        run: node --test scripts/ci/*.test.mjs
      - id: detect
        name: Decide pipelines
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = "true" ]; then node scripts/ci/detect-changes.mjs --base 0 --head "$GITHUB_SHA"
          else node scripts/ci/detect-changes.mjs --base "$BASE" --head "$GITHUB_SHA"; fi

  legacy:
    name: Legacy ERP untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums of legacy/
        run: |
          cd legacy && sha256sum --quiet -c ../infrastructure/ci/legacy.sha256
          test "$(find . -type f | wc -l)" -eq "$(wc -l < ../infrastructure/ci/legacy.sha256)" || { echo "files added to legacy/"; exit 1; }

  infra:
    name: Infrastructure validation
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (root + devcontainer)
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f .devcontainer/docker-compose.yml config --quiet
      - name: devcontainer.json is valid JSON(C)
        run: node -e "const s=require('fs').readFileSync('.devcontainer/devcontainer.json','utf8');JSON.parse(s.replace(/^\s*\/\/.*$/gm,''))"
      - name: Shell scripts (bash -n + shellcheck)
        run: |
          for f in scripts/*.sh infrastructure/codespaces/*.sh; do bash -n "$f"; done
          shellcheck -S warning scripts/*.sh infrastructure/codespaces/*.sh
      - name: Secret scan (tracked files)
        run: |
          if git grep -nE '(sk_live_[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC )?PRIVATE KEY-----)' -- ':!legacy' ':!**/*.test.*' ':!scripts/ci/*.test.mjs'; then
            echo "::error::possible credential committed"; exit 1; fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web.yml
    secrets: inherit

  control:
    needs: changes
    if: needs.changes.outputs.control == 'true'
    uses: ./.github/workflows/control.yml
    secrets: inherit

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/api.yml
    permissions: { contents: read, packages: write }
    secrets: inherit

  e2e:
    name: End-to-end (real API + Postgres, Playwright)
    needs: [changes, api, web]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: vendocas, POSTGRES_USER: vendocas, POSTGRES_PASSWORD: vendocas }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vendocas" --health-interval 5s --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/vendocas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: mvn -B -q package -DskipTests
        working-directory: apps/api
      - name: Start API (ephemeral CI secrets)
        run: |
          export JWT_SECRET=$(openssl rand -base64 48) CREDENTIALS_ENCRYPTION_KEY=$(openssl rand -base64 32)
          nohup java -jar apps/api/target/vendocas-api-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 2; done
      - run: pnpm install --frozen-lockfile && pnpm --filter @vendocas/tracking-sdk build && pnpm --filter @vendocas/web build
      - run: nohup pnpm --filter @vendocas/web start > web.log 2>&1 &
        env: { API_INTERNAL_URL: "http://localhost:8080" }
      - run: pnpm --filter @vendocas/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vendocas/web exec playwright test --trace off
        env: { E2E_API_LOG: "${{ github.workspace }}/api.log" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-logs, path: "*.log" }

  result:
    name: CI result
    if: always()
    needs: [changes, legacy, infra, web, control, api, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        env: { RESULTS: "${{ join(needs.*.result, ' ') }}" }
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do case "$r" in failure|cancelled) exit 1;; esac; done
