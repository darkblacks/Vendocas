name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java 25, unit + integration with Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - run: mvn -B verify
        working-directory: apps/api
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-reports, path: "apps/api/target/*-reports/" }

  web:
    name: Web (typecheck, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vendocas/tracking-sdk build
      - run: pnpm --filter @vendocas/web typecheck
      - run: pnpm --filter @vendocas/web test
      - run: pnpm --filter @vendocas/web build

  e2e:
    name: End-to-end (real API + Postgres, Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: vendocas, POSTGRES_USER: vendocas, POSTGRES_PASSWORD: vendocas }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vendocas" --health-interval 5s --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/vendocas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: mvn -B -q package -DskipTests
        working-directory: apps/api
      - name: Start API (ephemeral CI secrets)
        run: |
          export JWT_SECRET=$(openssl rand -base64 48) CREDENTIALS_ENCRYPTION_KEY=$(openssl rand -base64 32)
          nohup java -jar apps/api/target/vendocas-api-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health && break; sleep 2; done
      - run: pnpm install --frozen-lockfile && pnpm --filter @vendocas/web build
      - run: nohup pnpm --filter @vendocas/web start > web.log 2>&1 &
      - run: pnpm --filter @vendocas/web exec playwright install --with-deps chromium
      - run: pnpm --filter @vendocas/web exec playwright test --trace off
        env: { E2E_API_LOG: "${{ github.workspace }}/api.log" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-logs, path: "*.log" }

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: infrastructure/docker/api.Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/api:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: infrastructure/docker/web.Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/web:${{ github.sha }}" }
